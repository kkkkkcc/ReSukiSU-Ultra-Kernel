# ========================================
# ReSukiSU-Ultra 内核构建核心工作流
# 完全参照 GKI_KernelSU_SUSFS: bash 显式步骤, 不依赖 build.py
#   1. 环境准备
#   2. repo init + sync (kernel manifest)
#   3. KernelSU (ReSukiSU-Ultra) 集成
#   4. SUSFS (gitlab 上游)
#   5. 功能补丁 (patches.py 模块)
#   6. defconfig + fragment
#   7. bazel 构建
#   8. AK3 打包
# ========================================
name: 内核构建流程

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: "main"
      custom_suffix:
        required: false
        type: string
        default: ""
      build_time:
        required: false
        type: string
        default: "N"

jobs:
  build-kernel:
    name: "6.6.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-ReSukiSU-Ultra"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 构建信息摘要
        run: |
          echo "========================================"
          echo "        ReSukiSU-Ultra 内核构建"
          echo "========================================"
          echo "内核版本  : ${{ inputs.kernel_version }}.${{ inputs.sub_level }}"
          echo "补丁级别  : ${{ inputs.os_patch_level }}"
          echo "KSU 分支  : ReSukiSU-Ultra (${{ inputs.ksu_branch }})"
          echo "SUSFS     : ${{ inputs.enable_susfs }}"
          echo "========================================"

      - name: 清理磁盘空间
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* dotnet-sdk-*"
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/microsoft /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"

      - name: 检出代码仓库
        uses: actions/checkout@v7

      - name: 安装编译依赖
        run: |
          # 换源: azure.archive.ubuntu.com CDN 偶发卡死 → archive.ubuntu.com
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          # 参考 GKI_KernelSU_SUSFS: 精简 9 包 (runner 自带 Java 17/git/curl/zip/unzip/bc/cpio/jq)
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y ccache python3 python3-venv python3-yaml git curl \
            build-essential libssl-dev bison flex libelf-dev dwarves

      # ==================== bazel 磁盘缓存 (提速关键, 参考 GKI_KernelSU_SUSFS) ====================
      - name: 恢复 bazel 磁盘缓存
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel
          key: bazel-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-${{ inputs.os_patch_level }}
          restore-keys: |
            bazel-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-

      # ==================== 拉取内核源码 (repo manifest, 参考 GKI_KernelSU_SUSFS) ====================
      - name: 初始化并同步内核源码
        run: |
          set -e
          mkdir -p build/repo
          cd build/repo

          curl -s "https://gerrit.googlesource.com/git-repo/+/refs/tags/v2.16/repo?format=TEXT" | base64 -d > repo
          chmod +x repo

          if [ "${{ inputs.sub_level }}" == "77" ]; then
            FORMATTED_BRANCH="android15-6.6-2025-03"
            MANIFEST_BRANCH="common-android15-6.6-2025-03"
          else
            FORMATTED_BRANCH="android15-6.6-2026-01"
            MANIFEST_BRANCH="common-android15-6.6-2026-01"
          fi

          echo "repo init: ${MANIFEST_BRANCH}"
          ./repo init --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b ${MANIFEST_BRANCH} --repo-rev=v2.16

          if [ "${{ inputs.sub_level }}" == "77" ]; then
            sed -i 's/revision="android15-6.6-2025-03"/revision="deprecated\/android15-6.6-2025-03"/' .repo/manifests/default.xml
            echo "manifest: common -> deprecated/android15-6.6-2025-03"
          fi

          echo "repo sync..."
          ./repo sync -c -j$(nproc --all) --no-tags --fail-fast
          git -C common remote -v | head -2
          test -f common/Makefile && echo "common/Makefile OK"

      # ==================== 添加 KernelSU (ReSukiSU-Ultra) ====================
      - name: 添加 KernelSU (ReSukiSU-Ultra)
        run: |
          set -e
          cd build/repo
          # 克隆 ReSukiSU-Ultra 分支
          git clone --depth 1 https://github.com/kkkkkcc/ReSukiSU-Ultra KernelSU
          cd KernelSU
          git checkout ${{ inputs.ksu_branch }}
          echo "KSU commit: $(git rev-parse --short HEAD)"
          cd ..

          # 集成到内核树 (setup.sh 逻辑)
          cd common/drivers
          ln -sf "$(realpath --relative-to=. ../../KernelSU/kernel)" kernelsu
          grep -q "kernelsu" Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> Makefile
          grep -q "drivers/kernelsu/Kconfig" Kconfig || sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" Kconfig
          echo "KernelSU 集成完成"

          # ===== seccomp PF_EXITING 兼容修复 (6.6.118+ 防死机, 参考 build.py step05d) =====
          if [ "${{ inputs.sub_level }}" == "118" ]; then
            APP_PROFILE="../../KernelSU/kernel/policy/app_profile.c"
            if [ -f "$APP_PROFILE" ] && grep -q "KERNEL_VERSION(6, 11, 0)" "$APP_PROFILE"; then
              sed -i 's/KERNEL_VERSION(6, 11, 0)/KERNEL_VERSION(6, 6, 118)/' "$APP_PROFILE"
              echo "PF_EXITING 兼容修复已注入 (6.6.118+)"
            else
              echo "PF_EXITING 无需修复或已修复"
            fi
          fi

      # ==================== 应用 SUSFS (gitlab 上游) ====================
      - name: 应用 SUSFS
        run: |
          set -e
          cd build/repo
          # gitlab simonpunk 上游
          git clone --depth 1 -b gki-${{ inputs.android_version }}-${{ inputs.kernel_version }} \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          echo "SUSFS commit: $(git -C susfs4ksu log -1 --format='%H')"

          # 应用补丁 (参考 build.py step05e)
          cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./common/
          cp -r susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          cd common
          patch -p1 -F 3 -N --batch < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch
          # 关键验证: SUSFS exec/stat hook 必须打上 (sucompat 依赖)
          if ! grep -q "ksu_handle_execveat" fs/exec.c; then
            echo "::error::SUSFS exec.c hook 缺失! su 将不可用"
            exit 1
          fi
          if ! grep -q "ksu_handle_stat" fs/stat.c; then
            echo "::error::SUSFS stat.c hook 缺失!"
            exit 1
          fi

          # 6.6 上下文修复 (参考 GKI_KernelSU_SUSFS): 补丁 hunk 失配时补 susfs_def.h
          if grep -q 'SUSFS_IS_INODE_SUS_MAP\|susfs_is_current_proc_umounted\|SUSFS_IS_INODE_OPEN_REDIRECT' fs/proc/base.c && ! grep -qF 'susfs_def.h' fs/proc/base.c; then
            grep -qF '#include <linux/dma-buf.h>' fs/proc/base.c || sed -i '/#include <linux/cpufreq_times.h>/a #include <linux/dma-buf.h>' fs/proc/base.c
            sed -i '/#include <linux/dma-buf.h>/a #endif' fs/proc/base.c
            sed -i '/#include <linux/dma-buf.h>/a #include <linux/susfs_def.h>' fs/proc/base.c
            sed -i '/#include <linux/dma-buf.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)' fs/proc/base.c
            echo "  base.c susfs_def.h 已补齐"
          fi
          if grep -q 'SUSFS_IS_INODE_SUS_MAP' mm/memory.c && ! grep -qF 'susfs_def.h' mm/memory.c; then
            grep -qF '#include <linux/zswap.h>' mm/memory.c && sed -i '/#include <linux/zswap.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n#include <linux/susfs_def.h>\n#endif' mm/memory.c || sed -i '/#include <linux/sched/sysctl.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n#include <linux/susfs_def.h>\n#endif' mm/memory.c
            echo "  memory.c susfs_def.h 已补齐"
          fi

          # 补丁完整性检查 (有 .rej 则报警)
          REJ_COUNT=$(find . -name "*.rej" 2>/dev/null | wc -l)
          if [ "$REJ_COUNT" -gt 0 ]; then
            echo "::warning::存在 $REJ_COUNT 个 .rej 补丁冲突文件:"
            find . -name "*.rej" 2>/dev/null | head -10
          else
            echo "SUSFS 补丁应用完整 (无冲突)"
          fi

      # ==================== 应用功能补丁 (patches.py 模块) ====================
      - name: 应用功能补丁
        run: |
          python3 - << 'EOF'
          import sys, yaml
          from pathlib import Path
          sys.path.insert(0, '.')
          from patches import apply_all
          cfg = yaml.safe_load(open('config.yaml'))
          # 依据输入覆盖 features
          cfg['features']['bbg'] = False
          cfg['features']['zram_lz4kd'] = True
          cfg['features']['cve_fix'] = True
          cfg['features']['lts_fixes'] = False
          cfg['build']['lts_merge'] = False
          apply_all(cfg, Path('build/repo'), sublevel='${{ inputs.sub_level }}', kernel_base='${{ inputs.kernel_version }}.${{ inputs.sub_level }}')
          print('功能补丁应用完成')
          EOF
          REJ=$(find build/repo/common -name "*.rej" 2>/dev/null | wc -l)
          if [ "$REJ" -gt 0 ]; then
            echo "::error::功能补丁存在 $REJ 个 .rej 冲突:"
            find build/repo/common -name "*.rej" | head -10
            exit 1
          else
            echo "功能补丁应用完整 (无 .rej 冲突)"
          fi

      # ==================== 强制 ADIOS 默认 (elevator.c 拦截, 防 init.qti 切 cpq) ====================
      - name: 强制 ADIOS 默认 (elevator.c 拦截)
        run: |
          set -e
          EV=build/repo/common/block/elevator.c
          test -f "$EV" || { echo "::error::elevator.c 不存在"; exit 1; }
          python3 - "$EV" << 'EOF'
          import sys
          ev = sys.argv[1]
          txt = open(ev).read()
          changed = []
          failed = []
          seg = txt.split("elevator_get_default")[1][:400] if "elevator_get_default" in txt else ""
          if "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS" not in seg:
              for old in ('\treturn elevator_find_get(q, "mq-deadline");',
                          'return elevator_find_get(q, "mq-deadline");'):
                  if old in txt:
                      new = ('#ifdef CONFIG_MQ_IOSCHED_DEFAULT_ADIOS\n'
                             '\treturn elevator_find_get(q, "adios");\n'
                             '#else\n'
                             '\treturn elevator_find_get(q, "mq-deadline");\n'
                             '#endif')
                      txt = txt.replace(old, new, 1)
                      changed.append("elevator_get_default -> adios")
                      break
              else:
                  failed.append("elevator_get_default 锚点未匹配")
          open(ev, 'w').write(txt)
          for c in changed:
              print("已注入:", c)
          if failed:
              for f in failed:
                  print("::warning::" + f)
              exit(1)
          print("elevator.c: ADIOS 强制完成 (默认 adios + 切换保护)")
          EOF

      # ==================== MGLRU 强制全开 (FORCE3, 防 init.rc 关闭) ====================
      - name: 强制 MGLRU (vmscan FORCE3)
        run: |
          set -e
          VS=build/repo/common/mm/vmscan.c
          # 1) enabled_store: 任何写入强制 caps=3 (CORE | MM_WALK) — perl 注入, 无 tab 问题
          if ! grep -q "MGLRU FORCE3" "$VS"; then
            perl -0777 -pi -e 's/(\telse if \(kstrtouint\(buf, 0, &caps\)\)\n\t\treturn -EINVAL;\n)/$1\n#ifdef CONFIG_LRU_GEN_ENABLED\n\t\/\* ReSukiSU-Ultra: MGLRU FORCE3 \*\/\n\tcaps = 3;\n#endif\n/' "$VS"
            echo "vmscan.c: MGLRU FORCE3 (caps=3) 已注入"
          else
            echo "vmscan.c: MGLRU FORCE3 已存在"
          fi
          grep -c "MGLRU FORCE3" "$VS" || true

      - name: 应用 CVE 修复
        working-directory: build/repo/common
        run: |
          ACTUAL_SUB=$(grep '^SUBLEVEL = ' Makefile | awk '{print $3}')
          bash $GITHUB_WORKSPACE/third_party/security_patch/apply_cve_2026_43499.sh \
            ${{ inputs.kernel_version }} "$ACTUAL_SUB" $GITHUB_WORKSPACE/third_party/security_patch
          echo "CVE 修复完成 (SUBLEVEL=$ACTUAL_SUB)"

      # ==================== defconfig + fragment (参考 GKI_KernelSU_SUSFS: enable_config 检查 Kconfig) ====================
      - name: 生成 defconfig + fragment
        working-directory: build/repo/common
        run: |
          set -e
          DEFCONFIG=arch/arm64/configs/gki_defconfig
          FRAG=arch/arm64/configs/tesla.fragment

          # 备份原始 defconfig (fragment 通过 diff 生成)
          cp $DEFCONFIG $DEFCONFIG.orig

          # enable_config: 已启用跳过 / not set 原位替换 / 不存在追加
          enable_config() {
            local cfg="$1"
            if grep -q "^${cfg}=y" "$DEFCONFIG"; then
              echo "  已启用: $cfg"
            elif grep -q "^# ${cfg} is not set" "$DEFCONFIG"; then
              sed -i "s/^# ${cfg} is not set$/${cfg}=y/" "$DEFCONFIG"
              echo "  已切换: $cfg"
            else
              echo "${cfg}=y" >> "$DEFCONFIG"
              echo "  已添加: $cfg"
            fi
          }

          # 仅启用 Kconfig 已声明的项 (避免 savedefconfig 不匹配)
          config_defined() {
            local name="${1#CONFIG_}"
            grep -RqsE --include='Kconfig*' "^[[:space:]]*(menuconfig|config)[[:space:]]+${name}$" .
          }

          enable_config_if_defined() {
            local cfg="$1"
            if config_defined "$cfg"; then
              enable_config "$cfg"
            else
              echo "  跳过 (Kconfig 未声明): $cfg"
            fi
          }

          # KSU / 功能项
          enable_config_if_defined CONFIG_KSU
          enable_config_if_defined CONFIG_KSU_NETISOLATE
          enable_config_if_defined CONFIG_KSU_FUSEBPF_FIX
          # ipset 全家桶
          for c in CONFIG_IP_SET CONFIG_IP_SET_BITMAP_IP CONFIG_IP_SET_BITMAP_IPMAC CONFIG_IP_SET_BITMAP_PORT CONFIG_IP_SET_HASH_IP CONFIG_IP_SET_HASH_IPMARK CONFIG_IP_SET_HASH_IPPORT CONFIG_IP_SET_HASH_IPPORTIP CONFIG_IP_SET_HASH_IPPORTNET CONFIG_IP_SET_HASH_MAC CONFIG_IP_SET_HASH_NET CONFIG_IP_SET_HASH_NETIFACE CONFIG_IP_SET_HASH_NETNET CONFIG_IP_SET_HASH_NETPORT CONFIG_IP_SET_HASH_NETPORTNET CONFIG_IP_SET_LIST_SET CONFIG_NETFILTER_XT_SET; do
            enable_config_if_defined $c
          done
          # ADIOS IO 调度器 (choice 默认 → ADIOS; 真正生效靠 elevator.c 拦截步骤)
          enable_config_if_defined CONFIG_MQ_IOSCHED_ADIOS
          if config_defined CONFIG_MQ_IOSCHED_DEFAULT_ADIOS; then
            # choice: 替换 gki_defconfig 现有的默认调度器 (如 DEADLINE/CPQ) → ADIOS
            # 注意: 不要碰 CONFIG_DEFAULT_IOSCHED (Kconfig 无 prompt 的隐式字符串, 显式设置会被校验拒绝)
            sed -i 's/^CONFIG_MQ_IOSCHED_DEFAULT_[A-Z0-9_]*=y$/CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y/' $DEFCONFIG
            grep -q '^CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y' $DEFCONFIG || echo 'CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y' >> $DEFCONFIG
            echo "  ADIOS choice 已设为默认"
            # 诊断: 打印 gki_defconfig 调度器相关行
            echo "  --- gki_defconfig 调度器 ---"
            grep -E "IOSCHED" $DEFCONFIG | head -5
          else
            echo "  !! CONFIG_MQ_IOSCHED_DEFAULT_ADIOS Kconfig 未声明 (adios 补丁可能未生效)"
          fi
          # SSG IO 调度器 (Samsung) — 不开 SSG_CGROUP (6.6 无 cpd_init_fn, ratio=0 降速)
          enable_config_if_defined CONFIG_MQ_IOSCHED_SSG

          # MGLRU (显式开启, 强制 0x3)
          enable_config_if_defined CONFIG_LRU_GEN
          enable_config_if_defined CONFIG_LRU_GEN_ENABLED

          # ===== BBRv3 拥塞控制 (全开 17 算法 + 默认 bbr3, 参考 build.py) =====
          if config_defined CONFIG_TCP_CONG_BBR3; then
            for alg in BIC CUBIC WESTWOOD HTCP HSTCP HYBLA VEGAS NV SCALABLE LP VENO YEAH ILLINOIS DCTCP CDG BBR BBR3; do
              enable_config_if_defined CONFIG_TCP_CONG_$alg
            done
            if config_defined CONFIG_DEFAULT_BBR3; then
              sed -i 's/^CONFIG_DEFAULT_TCP_CONG_[A-Z0-9]*=y$/CONFIG_DEFAULT_BBR3=y/' $DEFCONFIG
              grep -q '^CONFIG_DEFAULT_BBR3=y' $DEFCONFIG || echo 'CONFIG_DEFAULT_BBR3=y' >> $DEFCONFIG
              echo "  BBRv3 设为默认拥塞控制 (17 算法全开)"
            fi
          else
            echo "  跳过: BBR3 Kconfig 未声明 (bbr3 补丁未生效?)"
          fi

          # ===== zram (内建 + lz4kd 默认 + 算法, 参考 GKI_KernelSU_SUSFS) =====
          if true; then
            enable_config_if_defined CONFIG_ZRAM
            enable_config_if_defined CONFIG_ZSMALLOC
            # 默认压缩 lz4kd (choice 原位替换)
            if config_defined CONFIG_ZRAM_DEF_COMP_LZ4KD; then
              sed -i 's/^CONFIG_ZRAM_DEF_COMP_[A-Z0-9]*=y$/CONFIG_ZRAM_DEF_COMP_LZ4KD=y/' $DEFCONFIG
              grep -q '^CONFIG_ZRAM_DEF_COMP_LZ4KD=y' $DEFCONFIG || echo 'CONFIG_ZRAM_DEF_COMP_LZ4KD=y' >> $DEFCONFIG
              echo "  zram 默认压缩: lz4kd"
            fi
            # zram.config 算法片段 (LZ4HC/LZ4K/LZ4KD/842/OPLUS)
            while IFS='=' read -r key val; do
              case "$key" in CONFIG_*) enable_config_if_defined "$key";; esac
            done < $GITHUB_WORKSPACE/third_party/zram-stack/zram.config
            echo "  zram 算法配置完成"
          fi

          # SUSFS 配置 (参考 GKI_KernelSU_SUSFS)
          if true; then
            cat >> $DEFCONFIG << 'SUSFS_EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          SUSFS_EOF
            echo "SUSFS CONFIG 已追加"
          fi

          # 生成 fragment (diff defconfig vs .orig, 参考 GKI_KernelSU_SUSFS)
          diff "$DEFCONFIG.orig" "$DEFCONFIG" | grep '^>' | sed 's/^> //; s/^[[:space:]]*//' > $FRAG || true
          # 不还原 defconfig (保留 ADIOS 默认等 choice 修改; check_defconfig 已关闭)
          echo "fragment 生成: $(wc -l < $FRAG) 项"
          head -40 $FRAG

      # ==================== KMI 兼容修复 (参照 GKI_KernelSU_SUSFS, wifi/网络/声音/震动模块加载) ====================
      - name: 修复 KMI 兼容性
        working-directory: build/repo/common
        run: |
          set -e
          # 移除 protected exports 限制 (KSU/SUSFS 导出符号需可见)
          sed -i '/protected_exports_list/d' BUILD.bazel 2>/dev/null || true
          sed -i '/kmi_symbol_list_strict_mode/d' BUILD.bazel 2>/dev/null || true
          rm -rf android/abi_gki_protected_exports_* 2>/dev/null || true

          # 移除 MODULES_ORDER (避免 vendor 模块目录不匹配)
          sed -i '/MODULES_ORDER=android\/gki_aarch64_modules/d' build.config.gki.aarch64 2>/dev/null || true

          # setlocalversion 去掉 -dirty / maybe-dirty (kleaf 可复现构建)
          sed -i 's/-dirty//' scripts/setlocalversion 2>/dev/null || true
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" build/kernel/kleaf/impl/stamp.bzl 2>/dev/null || true
          sed -i 's/-maybe-dirty//g' scripts/setlocalversion 2>/dev/null || true

          # ===== WiFi/蓝牙 厂商符号 (三星 min_kdp + 小米) =====
          ensure_line_once() {
            local file="$1"; local line="$2"
            if [ ! -f "$file" ]; then echo "  ! 文件不存在: $file"; return 0; fi
            if ! grep -qF "$line" "$file"; then echo "$line" >> "$file"; fi
          }
          GALAXY_SYMBOL_LIST="android/abi_gki_aarch64_galaxy"
          XIAOMI_SYMBOL_LIST="android/abi_gki_aarch64_xiaomi"
          KERNEL_PATCHES=$GITHUB_WORKSPACE/third_party/kernel_patches

          # 三星: KDP 符号 (幂等)
          if [ -f "$GALAXY_SYMBOL_LIST" ]; then
            ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_set_cred_non_rcu"
            ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_dec_and_test"
            ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_inc"
            echo "  三星 KDP 符号已追加"
          fi

          # 三星: min_kdp 驱动
          MIN_KDP_SRC="$KERNEL_PATCHES/samsung/min_kdp/min_kdp.c"
          MIN_KDP_PATCH="$KERNEL_PATCHES/samsung/min_kdp/add-min_kdp-symbols.patch"
          if [ -f "$MIN_KDP_SRC" ]; then
            cp "$MIN_KDP_SRC" drivers/min_kdp.c
            ensure_line_once drivers/Makefile "obj-y += min_kdp.o"
            echo "  三星 min_kdp 驱动已集成"
            if [ -f "$MIN_KDP_PATCH" ]; then
              patch -p1 --no-backup-if-mismatch < "$MIN_KDP_PATCH" 2>/dev/null || echo "  min_kdp 符号补丁跳过 (上下文不匹配)"
            fi
          fi

          # 小米: device_find_any_child 符号
          if [ -f "$XIAOMI_SYMBOL_LIST" ]; then
            ensure_line_once "$XIAOMI_SYMBOL_LIST" "device_find_any_child"
            echo "  小米符号已追加"
          fi
          echo "KMI 兼容修复完成"

      # ==================== 编译内核 (kleaf bazel, 参考 GKI_KernelSU_SUSFS) ====================
      - name: 设置构建时间
        run: |
          INPUT_TIME="${{ inputs.build_time }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "N" && "$INPUT_TIME" != "n" ]]; then
            DATESTR="$INPUT_TIME"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
          fi
          echo "使用构建时间: $DATESTR"
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> $GITHUB_ENV
          echo "KBUILD_BUILD_VERSION=1" >> $GITHUB_ENV

      - name: 修复 kleaf 时间戳覆盖 (防止内核版本日期固定 1970)
        run: |
          set -e
          SETUP_ENV=build/repo/build/kernel/_setup_env.sh
          test -f "$SETUP_ENV" || { echo "::error::$SETUP_ENV 不存在"; exit 1; }
          sed -i '/^export KBUILD_BUILD_TIMESTAMP=/d' "$SETUP_ENV"
          printf 'export KBUILD_BUILD_TIMESTAMP="${KBUILD_BUILD_TIMESTAMP:-$(date -d @${SOURCE_DATE_EPOCH})}"\n' >> "$SETUP_ENV"
          grep -n "KBUILD_BUILD_TIMESTAMP" "$SETUP_ENV"

      - name: 内核基础修复 (zram 内建 + nr_requests)
        run: |
          set -e
          cd build/repo
          # ZRAM 内建: 移除模块列表 (防与内建冲突)
          if [ -f common/modules.bzl ]; then
            sed -i 's/"drivers\/block\/zram\/zram.ko",\n//g' common/modules.bzl
            sed -i 's/"mm\/zsmalloc.ko",\n//g' common/modules.bzl
            sed -i 's/"drivers\/block\/zram\/zram.ko",//g' common/modules.bzl
            sed -i 's/"mm\/zsmalloc.ko",//g' common/modules.bzl
            echo "zram.ko/zsmalloc.ko 已从模块列表移除"
          fi
          # nr_requests 默认 256 (BLKDEV_DEFAULT_RQ 128→256)
          if grep -q "#define BLKDEV_DEFAULT_RQ" common/include/linux/blk-mq.h; then
            sed -i 's/#define BLKDEV_DEFAULT_RQ\t128/#define BLKDEV_DEFAULT_RQ\t256/' common/include/linux/blk-mq.h
            echo "BLKDEV_DEFAULT_RQ → 256"
          fi

      # ==================== 配置内核名称 (参考 GKI_KernelSU_SUSFS: -android15-8-gHASH-BID) ====================
      - name: 配置内核名称
        working-directory: build/repo
        run: |
          set -e
          # 自定义后缀优先, 否则默认 android15-8-gHASH-abBID
          BID="ab$((RANDOM % 90000000 + 10000000))"
          GHASH=$(git -C common rev-parse --verify HEAD | cut -c1-13)
          if [ -n "${{ inputs.custom_suffix }}" ]; then
            SUFFIX="${{ inputs.custom_suffix }}"
          else
            SUFFIX="-android15-8-g${GHASH}-${BID}"
          fi
          echo "内核后缀: $SUFFIX"
          echo "KERNEL_SUFFIX=$SUFFIX" >> $GITHUB_ENV
          # 6.6+ setlocalversion 注入 (参考仓库 perl, 保留 KERNELVERSION + config_localversion)
          perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${SUFFIX}"'\$\{config_localversion\}"/s' common/scripts/setlocalversion 2>/dev/null || true
          # maybe-dirty 修复 (kleaf 可复现构建)
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" build/kernel/kleaf/impl/stamp.bzl 2>/dev/null || true
          echo "内核名称配置完成: 6.6.x${SUFFIX}"

      - name: 编译内核
        run: |
          set -e
          cd build/repo
          # 关闭 savedefconfig 校验 (check_defconfig) 与 KMI 严格模式
          sed -i 's/check_defconfig//' common/build.config.gki
          sed -i 's/BUILD_SYSTEM_DLKM=1/BUILD_SYSTEM_DLKM=0/' common/build.config.gki.aarch64
          sed -i '/KMI_SYMBOL_LIST_STRICT_MODE/d' common/build.config.gki.aarch64
          tools/bazel build --disk_cache=/home/runner/.cache/bazel \
            --config=fast --config=stamp --lto=thin \
            --action_env=KBUILD_BUILD_TIMESTAMP \
            --defconfig_fragment=//common:arch/arm64/configs/tesla.fragment \
            //common:kernel_aarch64_dist
          test -f bazel-bin/common/kernel_aarch64/Image && echo "Image OK"

      # ==================== 打包 AK3 ====================
      - name: 打包 AnyKernel3
        run: |
          set -e
          ZIP_NAME="android15-6.6.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-AnyKernel3.zip"
          mkdir -p out
          rm -f out/$ZIP_NAME
          # 直接打包 AnyKernel3 内容 + Image (参考 GKI_KernelSU_SUSFS: cd AnyKernel3 目录 zip)
          cd third_party/AnyKernel3
          cp ../../build/repo/bazel-bin/common/kernel_aarch64/Image ./Image
          zip -q -r ../../out/$ZIP_NAME ./*
          rm -f ./Image
          ls -la ../../out/$ZIP_NAME

      - name: 上传内核产物
        uses: actions/upload-artifact@v7
        with:
          name: kernel-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-${{ inputs.android_version }}
          path: out/*.zip
          if-no-files-found: error
          compression-level: 0

